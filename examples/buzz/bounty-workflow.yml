name: OEXL bounty intake
description: Turn an invited buyer's structured /bounty message into a marketplace task.
trigger:
  on: message_posted
  filter: "str_starts_with(trigger_text, '/bounty')"
steps:
  - id: post_bounty
    action: call_webhook
    url: "__OEXL_PUBLIC_URL__/v1/integrations/buzz/tasks"
    method: POST
    headers:
      Content-Type: "text/plain; charset=utf-8"
      X-OEXL-Webhook-Secret: "__OEXL_BUZZ_WEBHOOK_SECRET__"
      X-Buzz-Relay: "__BUZZ_RELAY_URL__"
      X-Buzz-Author: "{{trigger.author}}"
      X-Buzz-Channel: "{{trigger.channel_id}}"
      X-Buzz-Event: "{{trigger.message_id}}"
    body: "{{trigger.text}}"
  - id: acknowledge
    if: "steps_post_bounty_output_status == 200"
    action: send_message
    text: "OEXL accepted this bounty request. It will post the deliverable here for buyer review."
